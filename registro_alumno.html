<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de alumno | CREA Cuervos</title>
    <link rel="stylesheet" href="log&signin_style.css"/>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Registro de alumnos y estudiantes</p>
</header>

<main>
    <div>
        <h2>Crear cuenta de estudiante</h2>

        <form action="login_alumno.html" method="get">
            <label>Nombre completo</label>
            <input type="text" required placeholder="Nombre y apellidos">

            <label>Matrícula o número de control</label>
            <input type="text" required placeholder="Ingresa tu matrícula">

            <label>Correo electrónico</label>
            <input type="email" required placeholder="Correo electrónico">

            <label>Contraseña</label>
            <input type="password" required placeholder="Crea una contraseña">

            <label>Confirmar contraseña</label>
            <input type="password" required placeholder="Confirma tu contraseña">

            <button type="submit">Registrar alumno</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="login_alumno.html">Inicia sesión</a></p>
        <a href="indexMenu.html">Regresar al inicio</a>
    </div>
</main>

</body>
</html>
