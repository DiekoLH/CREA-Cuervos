<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de alumno | CREA Cuervos</title>
    <link rel="stylesheet" href="log&signin_style.css"/>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Registro de alumnos y estudiantes</p>
</header>

<main>
    <div>
        <h2>Crear cuenta de estudiante</h2>

        <form data-auth-form="register" data-role="alumno">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="name" type="text" required placeholder="Nombre y apellidos">

            <label for="identificador">Matrícula o número de control</label>
            <input id="identificador" name="identifier" type="text" required placeholder="Ingresa tu matrícula">

            <label for="correo">Correo electrónico</label>
            <input id="correo" name="email" type="email" required placeholder="Correo electrónico">

            <label for="contrasena">Contraseña</label>
            <input id="contrasena" name="password" type="password" minlength="8" required placeholder="Crea una contraseña">

            <label for="confirmar-contrasena">Confirmar contraseña</label>
            <input id="confirmar-contrasena" name="passwordConfirmation" type="password" minlength="8" required placeholder="Confirma tu contraseña">

            <p class="auth-message" role="alert" hidden></p>
            <button type="submit">Registrar alumno</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="login_alumno.html">Inicia sesión</a></p>
        <a href="indexMenu.html">Regresar al inicio</a>
    </div>
</main>

<script src="auth.js"></script>
</body>
</html>
