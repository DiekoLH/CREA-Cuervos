<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de docente | CREA Cuervos</title>
    <link rel="stylesheet" href="log&signin_style.css"/>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Registro de docentes e instructores</p>
</header>

<main>
    <div>
        <h2>Crear cuenta de instructor</h2>

        <form action="login_docente.html" method="get">
            <label>Nombre completo</label>
            <input type="text" required placeholder="Nombre y apellidos">

            <label>Número de identificación</label>
            <input type="text" required placeholder="Crea o ingresa tu identificación">

            <label>Correo electrónico</label>
            <input type="email" required placeholder="Correo electrónico">

            <label>Taller que imparte</label>
            <select required>
                <option value="">Selecciona un taller</option>
                <option>Danza</option>
                <option>Fútbol</option>
                <option>Voleibol</option>
                <option>Rondalla</option>
                <option>Ortografía</option>
                <option>Artes</option>
                <option>Básquetbol</option>
                <option>Ajedrez</option>
            </select>

            <label>Contraseña</label>
            <input type="password" required placeholder="Crea una contraseña">

            <label>Confirmar contraseña</label>
            <input type="password" required placeholder="Confirma tu contraseña">

            <button type="submit">Registrar instructor</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="login-docente.html">Inicia sesión</a></p>
        <a href="indexMenu.html">Regresar al inicio</a>
    </div>
</main>

</body>
</html>
