<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de docente | CREA Cuervos</title>
    <link rel="stylesheet" href="log&signin_style.css"/>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Registro de docentes e instructores</p>
</header>

<main>
    <div>
        <h2>Crear cuenta de instructor</h2>

        <form id="form-registro-docente" method="post">
            <label>Nombre completo</label>
            <input type="text" name="nombre" required placeholder="Nombre y apellidos">

            <label>Número de identificación</label>
            <input type="text" name="identificacion" required placeholder="Crea o ingresa tu identificación">

            <label>Correo electrónico</label>
            <input type="email" name="correo" required placeholder="Correo electrónico">

            <label>Taller que imparte</label>
            <select name="taller_impartido" required style="width:100%;padding:12px 14px;border:1px solid #d3e2dd;border-radius:9px;font-size:14px;background:#f8fbfa;color:#183b36;">
                <option value="">Selecciona un taller</option>
                <option value="Danza y baile">Danza y baile</option>
                <option value="Fútbol soccer">Fútbol soccer</option>
                <option value="Voleibol">Voleibol</option>
                <option value="Música">Música</option>
                <option value="Ortografía y redacción">Ortografía y redacción</option>
                <option value="Artes visuales">Artes visuales</option>
                <option value="Teatro">Teatro</option>
            </select>

            <label>Contraseña</label>
            <input type="password" name="contrasena" required placeholder="Crea una contraseña">

            <label>Confirmar contraseña</label>
            <input type="password" name="confirmar_contrasena" required placeholder="Confirma tu contraseña">

            <p id="msg-registro-docente" style="display:none;color:#b3382e;font-size:13px;margin-top:6px;"></p>

            <button type="submit">Registrar instructor</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="login_docente.html">Inicia sesión</a></p>
        <a href="indexMenu.html">Regresar al inicio</a>
    </div>
</main>

<script>
document.getElementById("form-registro-docente").addEventListener("submit", async function(e) {
    e.preventDefault();
    const fd = new FormData(this);
    const msg = document.getElementById("msg-registro-docente");
    msg.style.display = "none";

    if (fd.get("contrasena") !== fd.get("confirmar_contrasena")) {
        msg.textContent = "Las contraseñas no coinciden.";
        msg.style.display = "block";
        return;
    }
    fd.append("action", "registro_instructor");

    const res = await fetch("api.php", { method: "POST", body: fd });
    const data = await res.json();
    if (!data.ok) {
        msg.textContent = data.error || "Error al registrar.";
        msg.style.display = "block";
        return;
    }
    sessionStorage.setItem("creaInstructor", JSON.stringify(data.user));
    window.location.href = "instructor.html";
});
</script>
</body>
</html>
