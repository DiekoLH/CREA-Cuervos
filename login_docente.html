<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso de docente </title>
    <link rel="stylesheet" href="log&signin_style.css"/>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Acceso para docentes e instructores</p>
</header>

<main>
    <div>
        <h2>Inicio de sesión</h2>
        <p>Ingresa tus datos para administrar tu taller.</p>

        <form action="docente.html" method="get">
            <label>Usuario o identificación</label>
            <input type="text" required placeholder="Ingresa tu usuario">

            <label>Contraseña</label>
            <input type="password" required placeholder="Ingresa tu contraseña">

            <button type="submit">Ingresar como docente</button>
        </form>

        <p>¿No tienes cuenta? <a href="registro-docente.html">Regístrate aquí</a></p>
        <a href="indexMenu.html">Regresar al inicio</a>
    </div>
</main>

</body>
</html>
