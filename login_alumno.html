<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso de alumno | CREA Cuervos</title>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Acceso para alumnos y estudiantes</p>
</header>

<main>
    <div>
        <h2>Inicio de sesión</h2>
        <p>Ingresa tus datos para consultar tus talleres y avance.</p>

        <form action="alumno.html" method="get">
            <label>Matrícula o usuario</label>
            <input type="text" required placeholder="Ingresa tu matrícula o usuario">

            <label>Contraseña</label>
            <input type="password" required placeholder="Ingresa tu contraseña">

            <button type="submit">Ingresar como alumno</button>
        </form>

        <p>¿No tienes cuenta? <a href="registro_alumno.html">Regístrate aquí</a></p>
        <a href="index.html">Regresar al inicio</a>
    </div>
</main>

</body>
</html>
