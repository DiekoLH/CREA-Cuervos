<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso de docente </title>
    <link rel="stylesheet" href="log&signin_style.css"/>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Acceso para Instructores.</p>
</header>

<main>
    <div>
        <h2>Inicio de sesión</h2>
        <p>Ingresa tus datos para administrar tu taller.</p>

        <form data-auth-form="login" data-role="instructor">
            <label for="identificador">Identificación o correo electrónico</label>
            <input id="identificador" name="identifier" type="text" required placeholder="Ingresa tu identificación o correo">

            <label for="contrasena">Contraseña</label>
            <input id="contrasena" name="password" type="password" required placeholder="Ingresa tu contraseña">

            <p class="auth-message" role="alert" hidden></p>
            <button type="submit">Ingresar como Instructor</button>
        </form>

        <p>¿No tienes cuenta? <a href="registro_docente.html">Regístrate aquí</a></p>
        <a href="indexMenu.html">Regresar al inicio</a>
    </div>
</main>

<script src="auth.js"></script>
</body>
</html>
