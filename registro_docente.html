<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de docente | CREA Cuervos</title>
    <link rel="stylesheet" href="log&signin_style.css"/>
</head>
<body>

<header>
    <h1>CREA CUERVOS</h1>
    <p>Registro de docentes e instructores</p>
</header>

<main>
    <div>
        <h2>Crear cuenta de instructor</h2>

        <form data-auth-form="register" data-role="instructor">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="name" type="text" required placeholder="Nombre y apellidos">

            <label for="identificador">Número de identificación</label>
            <input id="identificador" name="identifier" type="text" required placeholder="Crea o ingresa tu identificación">

            <label for="correo">Correo electrónico</label>
            <input id="correo" name="email" type="email" required placeholder="Correo electrónico">

            <label for="taller">Taller que imparte</label>
            <select id="taller" name="workshop" required>
                <option value="">Selecciona un taller</option>
                <option>Danza</option>
                <option>Fútbol</option>
                <option>Voleibol</option>
                <option>Rondalla</option>
                <option>Ortografía</option>
                <option>Artes</option>
                <option>Básquetbol</option>
                <option>Ajedrez</option>
            </select>

            <label for="contrasena">Contraseña</label>
            <input id="contrasena" name="password" type="password" minlength="8" required placeholder="Crea una contraseña">

            <label for="confirmar-contrasena">Confirmar contraseña</label>
            <input id="confirmar-contrasena" name="passwordConfirmation" type="password" minlength="8" required placeholder="Confirma tu contraseña">

            <p class="auth-message" role="alert" hidden></p>
            <button type="submit">Registrar instructor</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="login_docente.html">Inicia sesión</a></p>
        <a href="indexMenu.html">Regresar al inicio</a>
    </div>
</main>

<script src="auth.js"></script>
</body>
</html>
